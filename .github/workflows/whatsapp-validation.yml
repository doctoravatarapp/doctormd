name: WhatsApp integration validation
on:
  push:
    branches: [feature/whatsapp-cloud-api-foundation]
  pull_request:
    paths:
      - 'app/api/integrations/whatsapp/**'
      - 'lib/integrations/whatsapp/**'
      - 'tests/whatsapp-webhook.test.ts'
      - 'supabase/migrations/*whatsapp*'
      - '.github/workflows/whatsapp-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: node --experimental-strip-types --test tests/whatsapp-webhook.test.ts
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm build
